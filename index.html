<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มีของขวัญมาให้ครับ 🎁</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            width: 100%;
            padding: 20px;
        }
        /* หน้าแรก: กล่องของขวัญ */
        .gift-box {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .gift-box:hover {
            transform: scale(1.1) rotate(5deg);
        }
        .gift-icon {
            font-size: 100px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        .hint-text {
            color: #c62828;
            font-size: 18px;
            margin-top: 15px;
            font-weight: 600;
        }
        /* หน้าสอง: จดหมายบอกรัก */
        .letter-card {
            display: none;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            margin: 0 auto;
            position: relative;
            animation: unfold 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }
        @keyframes unfold {
            0% { transform: scaleY(0.005) scaleX(0); }
            50% { transform: scaleY(0.005) scaleX(1); }
            100% { transform: scaleY(1) scaleX(1); }
        }
        .heart-icon {
            font-size: 40px;
            color: #e91e63;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .typewriter-text {
            font-size: 20px;
            color: #444;
            line-height: 1.8;
            min-height: 80px;
            margin-bottom: 20px;
            word-wrap: break-word;
        }
        /* เอฟเฟกต์หัวใจลอย */
        .floating-heart {
            position: absolute;
            color: #ff4081;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 2s linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนที่ 1: หน้ากล่องของขวัญ -->
        <div id="gift-screen" class="gift-box" onclick="openGift()">
            <div class="gift-icon">🎁</div>
            <div class="hint-text">มีของขวัญส่งถึงสาวคนพิเศษ... ลองกดเปิดดูสิครับ</div>
        </div>

        <!-- ส่วนที่ 2: หน้าจดหมายความในใจ -->
        <div id="letter-screen" class="letter-card">
            <div class="heart-icon">❤️</div>
            <div id="text-target" class="typewriter-text"></div>
        </div>
    </div>

    <script>
        // ข้อความความในใจที่คุณสามารถปรับเปลี่ยนเองได้ในอนาคต
        const messageToShow = "แอบมองมาตั้งนาน วันนี้รวบรวมความกล้าทักมาหา... อยากจะบอกสาวคนนี้ตรง ๆ ว่า เค้าชอบเธอเข้าแล้วล่ะครับ ขอโอกาสให้เค้าเดินหน้าจีบเธอได้ไหมนะ? 😳💖";
        let index = 0;

        function openGift() {
            // ซ่อนกล่องของขวัญแล้วแสดงการ์ดจดหมาย
            document.getElementById('gift-screen').style.display = 'none';
            document.getElementById('letter-screen').style.display = 'block';
            
            // เริ่มการพิมพ์ตัวอักษรและเอฟเฟกต์หัวใจ
            typeWriter();
            setInterval(createHeart, 400);
        }

        // ฟังก์ชันทำให้ข้อความค่อย ๆ พิมพ์ออกมาทีละตัว
        function typeWriter() {
            if (index < messageToShow.length) {
                document.getElementById("text-target").innerHTML += messageToShow.charAt(index);
                index++;
                setTimeout(typeWriter, 80); // ปรับความเร็วการพิมพ์ตรงนี้ (มิลลิวินาที)
            }
        }

        // ฟังก์ชันสร้างเอฟเฟกต์หัวใจลอยรอบ ๆ การ์ด
        function createHeart() {
            const card = document.getElementById('letter-screen');
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerText = '❤️';
            
            // สุ่มตำแหน่งซ้าย-ขวา
            heart.style.left = Math.random() * card.offsetWidth + 'px';
            heart.style.top = '10px';
            
            card.appendChild(heart);
            
            // ลบหัวใจทิ้งเมื่อแสดงแอนิเมชันเสร็จ
            setTimeout(() => {
                heart.remove();
            }, 2000);
        }
    </script>
</body>
</html>
